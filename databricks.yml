bundle:
  name: uber_databricks_lakehouse

variables:
  catalog_name:
    description: "Unity Catalog name for Uber Lakehouse schemas and volumes"
    default: "uber_lakehouse"
  sample_rows:
    description: "Number of NYC TLC HVFHV rows to sample (0 = full ~19.6M rows)"
    default: "150000"

resources:
  jobs:
    uber_end_to_end_lakehouse_job:
      name: "[${bundle.target}] Uber End-to-End Lakehouse & Michelangelo ML DAG"
      max_concurrent_runs: 1
      tasks:
        - task_key: setup_and_governance
          notebook_task:
            notebook_path: ./notebooks/00_setup_and_config.py
            base_parameters:
              catalog_name: ${var.catalog_name}
              sample_rows: ${var.sample_rows}

        - task_key: ingest_public_bronze
          depends_on:
            - task_key: setup_and_governance
          notebook_task:
            notebook_path: ./notebooks/01_public_data_ingestion_bronze.py
            base_parameters:
              catalog_name: ${var.catalog_name}
              sample_rows: ${var.sample_rows}

        - task_key: realtime_streaming_and_cdc
          depends_on:
            - task_key: ingest_public_bronze
          notebook_task:
            notebook_path: ./notebooks/02_realtime_event_simulator_and_streaming.py
            base_parameters:
              catalog_name: ${var.catalog_name}

        - task_key: silver_cleansing_h3_scd2
          depends_on:
            - task_key: realtime_streaming_and_cdc
          notebook_task:
            notebook_path: ./notebooks/03_silver_cleansing_geospatial_scd2.py
            base_parameters:
              catalog_name: ${var.catalog_name}

        - task_key: gold_kimball_warehouse
          depends_on:
            - task_key: silver_cleansing_h3_scd2
          notebook_task:
            notebook_path: ./notebooks/04_gold_dimensional_warehouse.py
            base_parameters:
              catalog_name: ${var.catalog_name}

        - task_key: ml_eta_prediction
          depends_on:
            - task_key: gold_kimball_warehouse
          notebook_task:
            notebook_path: ./notebooks/05_ml_eta_prediction.py
            base_parameters:
              catalog_name: ${var.catalog_name}

        - task_key: ml_surge_pricing_forecast
          depends_on:
            - task_key: gold_kimball_warehouse
          notebook_task:
            notebook_path: ./notebooks/06_ml_surge_pricing_forecast.py
            base_parameters:
              catalog_name: ${var.catalog_name}

        - task_key: ml_cancellation_and_fraud
          depends_on:
            - task_key: gold_kimball_warehouse
          notebook_task:
            notebook_path: ./notebooks/07_ml_cancellation_and_fraud.py
            base_parameters:
              catalog_name: ${var.catalog_name}

  pipelines:
    uber_medallion_dlt_pipeline:
      name: "[${bundle.target}] Uber Lakeflow DLT Medallion Pipeline"
      catalog: ${var.catalog_name}
      target: dlt_uber
      serverless: true
      development: true
      configuration:
        uber.landing_path: /Volumes/${var.catalog_name}/raw_landing/landing_zone
      libraries:
        - notebook:
            path: ./pipelines/dlt_uber_medallion_pipeline.py

targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production
    variables:
      sample_rows: "1000000"
