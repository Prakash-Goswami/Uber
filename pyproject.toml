[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uber-databricks-lakehouse"
version = "1.0.0"
description = "End-to-End Uber Data Engineering, Streaming, Data Warehousing & Michelangelo ML Simulation on Databricks Lakehouse"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Data Engineering Platform Team"}
]
dependencies = [
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
databricks = [
    "pyspark>=3.5.0",
    "delta-spark>=3.1.0",
    "mlflow>=2.11.0",
    "h3>=3.7.6",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
